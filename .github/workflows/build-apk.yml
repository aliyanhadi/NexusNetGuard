name: Build APKs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build both debug APKs
        run: gradle assembleStandardDebug assembleProDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNetGuard
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNetGuard-pro
          path: app/build/outputs/apk/pro/debug/*.apk
          if-no-files-found: error

  release:
    # Signed release APKs. Runs manually (Run workflow) or on version tags like v1.0.0.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode keystore (if secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: release will be debug-signed."
          fi

      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleStandardRelease assembleProRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNetGuard
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: NexusNetGuard-pro
          path: app/build/outputs/apk/pro/release/*.apk
          if-no-files-found: error
